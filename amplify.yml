version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - node -e "console.log('SES package resolved:', require.resolve('@aws-sdk/client-ses'))"
    build:
      commands:
        - |
          cat <<EOT > .env.production
          REGION=$REGION
          AWS_REGION=$REGION
          DYNAMODB_TABLE=$DYNAMODB_TABLE
          DYNAMODB_ORDER_TABLE=$DYNAMODB_ORDER_TABLE
          ADMIN_TOKEN=$ADMIN_TOKEN
          NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
          SES_FROM_EMAIL=$SES_FROM_EMAIL
          PESAPAL_CONSUMER_KEY=$PESAPAL_CONSUMER_KEY
          PESAPAL_CONSUMER_SECRET=$PESAPAL_CONSUMER_SECRET
          PESAPAL_BASE_URL=$PESAPAL_BASE_URL
          PESAPAL_IPN_ID=$PESAPAL_IPN_ID
          EOT
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
