version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - node -e "console.log('SES package resolved:', require.resolve('@aws-sdk/client-ses'))"
    build:
      commands:
        - |
          node <<'NODE'
          const fs = require('fs');
          const envNames = [
            'REGION',
            'AWS_REGION',
            'DYNAMODB_TABLE',
            'DYNAMODB_ORDER_TABLE',
            'ADMIN_TOKEN',
            'NEXT_PUBLIC_SITE_URL',
            'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY',
            'SES_FROM_EMAIL',
            'PESAPAL_BASE_URL',
            'PESAPAL_CONSUMER_KEY',
            'PESAPAL_CONSUMER_SECRET',
            'PESAPAL_IPN_ID'
          ];
          const lines = envNames.map((name) => {
            const value = name === 'AWS_REGION' ? (process.env.AWS_REGION || process.env.REGION || '') : (process.env[name] || '');
            return `${name}=${JSON.stringify(value)}`;
          });
          fs.writeFileSync('.env.production', `${lines.join('\n')}\n`);
          NODE
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
