version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - |
          cat <<EOT > .env.production
          REGION=$REGION
          DYNAMODB_TABLE=$DYNAMODB_TABLE
          DYNAMODB_ORDER_TABLE=$DYNAMODB_ORDER_TABLE
          ADMIN_TOKEN=$ADMIN_TOKEN
          NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
          EOT
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
